# Adds a local MinIO instance to the Astro dev environment, on the same
# Docker network as the Airflow containers (scheduler, webserver, etc.).
# Astro CLI auto-detects this file at project root when you run `astro dev start`.
#
# After `astro dev start`:
#   - MinIO API:     http://localhost:9000
#   - MinIO Console:  http://localhost:9001  (login: minioadmin / minioadmin)
#
# From inside Airflow containers, reach MinIO at http://minio:9000 (service name,
# not localhost) — that's the hostname to use in the Airflow Connection's
# endpoint_url.

services:
  minio:
    image: minio/minio:latest
    container_name: chem-pipeline-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - airflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
